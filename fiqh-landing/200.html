<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/">
  <title>تحويل...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #FFFFFF;
      color: #000000;
      font-family: 'Cairo', sans-serif;
    }
    .loader {
      text-align: center;
    }
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E5E5E5;
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #737373;
      font-size: 1rem;
    }
    a {
      color: #000000;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      color: #404040;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-spinner"></div>
    <p>جارٍ التحميل...</p>
    <p><a href="/">اضغط هنا إذا لم يتم التحويل تلقائيًا</a></p>
  </div>
</body>
</html>
